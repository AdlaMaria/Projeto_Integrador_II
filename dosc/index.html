<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PainelFila Escolar</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            text-align: center;
            padding: 30px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }

        h1 {
            margin-bottom: 10px;
        }

        .senha-atual {
            font-size: 60px;
            font-weight: bold;
            margin: 25px;
        }

        button {
            padding: 14px 20px;
            margin: 8px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        .retirar {
            background: #4CAF50;
            color: white;
        }

        .chamar {
            background: #2196F3;
            color: white;
        }

        .fila {
            margin-top: 25px;
            text-align: left;
        }

        li {
            margin: 8px 0;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>PainelFila Escolar</h1>

        <p>Organização do atendimento e controle de filas da escola.</p>

        <h2>Senha chamada</h2>

        <div id="senhaAtual" class="senha-atual">
            ---
        </div>

        <button class="retirar" onclick="retirarSenha()">
            Retirar senha
        </button>

        <button class="chamar" onclick="chamarSenha()">
            Chamar próxima senha
        </button>

        <div class="fila">
            <h2>Fila de espera</h2>
            <ul id="fila"></ul>
        </div>

    </div>

    <script>
        let numeroSenha = 0;
        let fila = [];

        function retirarSenha() {
            numeroSenha++;

            let senha = "A" + String(numeroSenha).padStart(3, "0");

            fila.push(senha);

            atualizarFila();

            alert("Sua senha é " + senha);
        }

        function chamarSenha() {
            if (fila.length === 0) {
                alert("Não há senhas aguardando atendimento.");
                return;
            }

            let senha = fila.shift();

            document.getElementById("senhaAtual").textContent = senha;

            atualizarFila();
        }

        function atualizarFila() {
            let lista = document.getElementById("fila");

            lista.innerHTML = "";

            fila.forEach(function(senha) {
                let item = document.createElement("li");

                item.textContent = senha;

                lista.appendChild(item);
            });
        }
    </script>

</body>
</html>
